<div id="out"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const BSV_ORIGIN = { "pc.glb":"29ef03b0e0aabb4c9adef4c0c7f1f37aa11567e554366d49bc90e369cf4c7994_0",
  "cpu.glb":"366ff5a850a655727b8a28178556a86e19f06a81da34a35d5c03b48c885a16a8_0",
  "gpu_tx120.glb":"9db877b8694330ab9cd56a93f14680a1a1cee0b0df0b526865fde2ebca9d31a7_0",

  "gen2.glb":"109a1bba976772a4c40100bd2010cef8dd3fce7681bbc95d2a23eea3755606f5_0" };

  { id:1,  key:"pc.glb" }, { id:3, key:"cpu.glb" }, { id:4, key:"gpu_tx120.glb" },
  { id:5,  key:"gpu_gp50.glb" },
  { id:14, scene:"14_Mining_Rig_Frame" }, { id:9, scene:"9_XL_190_CPU" },

  { id:10, scene:"10_GP_720_GPU", rot:[Math.PI,0,0] }, { id:11, scene:"11_GPX_880_a" },
  { id:13, scene:"13_Bit_Hammer_ASIC" }, { id:19, scene:"19_Server_Tower" },

</script>
